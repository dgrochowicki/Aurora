<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12151a" />
  <meta name="description" content="Mobilna prognoza zorzy polarnej dla Twojej lokalizacji." />
  <title>Aurora Now</title>
  <!-- Aplikacja z ekranu początkowego: bez pasków Safari, treść także pod paskiem statusu (black-translucent),
       odstęp od góry dają env(safe-area-inset-top) w CSS. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aurora" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23071217'/%3E%3Cpath d='M5 22c5-14 10 4 22-13-5 15-11 6-22 13Z' fill='%2368f7bb'/%3E%3C/svg%3E" />
  <!-- Leaflet z CDN z sumą kontrolną (SRI) z leafletjs.com: przeglądarka nie uruchomi podmienionego pliku. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./css/tokens.css?v=38" />
  <link rel="stylesheet" href="./css/base.css?v=26" />
  <link rel="stylesheet" href="./css/components.css?v=90" />
</head>
<body>
  <main class="app-shell">
    <div class="aurora-sky" id="auroraSky" aria-hidden="true"><i class="aurora-green"></i><i class="aurora-green-2"></i><i class="aurora-violet"></i></div>
    <header class="topbar">
      <h1><button type="button" class="place-name" id="locationName" aria-haspopup="dialog">Szczecin</button></h1>
      <div class="topbar-meta"><span id="todayText"></span><span id="updatedText"></span></div>
    </header>

    <section class="chance" aria-live="polite">
      <button type="button" class="headline chance-link" id="summary" data-detail="score" aria-haspopup="dialog">Sprawdzam…</button>
      <p class="tips"><span id="tip" hidden></span><span id="outlook" hidden></span></p>
    </section>

    <section class="section">
      <h2 class="section-title">Najbliższe godziny</h2>
      <div class="hourly" id="hourly" role="group" aria-label="Wybierz godzinę prognozy"></div>
      <p class="hour-detail" id="hourDetail" aria-live="polite"></p>
      <p class="tz-note note" id="tzNote" hidden></p>
    </section>

    <section class="section" aria-label="Aktywność zorzy">
      <h2 class="section-title">Aktywność zorzy <span class="section-value" id="activityLevel"></span></h2>
      <div class="tile-grid" id="activityTiles"></div>
    </section>

    <section class="section" aria-label="Warunki obserwacji">
      <h2 class="section-title">Warunki obserwacji</h2>
      <div class="tile-grid" id="conditionTiles"></div>
      <p class="confidence note" id="confidenceText">Kompletność danych: sprawdzam…</p>
    </section>
  </main>

  <div class="fab-bar">
    <button type="button" class="fab" id="mapBtn" aria-label="Mapa zorzy" aria-haspopup="dialog"></button>
    <button type="button" class="fab" id="placesBtn" aria-label="Zmień miejsce" aria-haspopup="dialog"></button>
  </div>

  <section class="places-sheet sheet" id="placesSheet" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="placesTitle" hidden>
    <div class="places-head">
      <h2 id="placesTitle">Wybierz miejsce</h2>
      <div class="search-row">
        <label class="search-field"><span class="search-icon" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="Wpisz miasto lub miejscowość" autocomplete="off" aria-label="Szukaj miejsca" /></label>
        <button type="button" class="search-close" id="searchClose" aria-label="Zamknij wyszukiwanie"></button>
      </div>
    </div>
    <div class="sheet-scroll">
      <p class="search-hint" id="searchHint" hidden></p>
      <div class="search-results" id="searchResults"></div>
      <div class="places" id="places"></div>
      <p class="places-note" id="placesNote">Pewność prognozy: sprawdzam…</p>
    </div>
  </section>

  <section class="map-sheet sheet" id="mapSheet" aria-modal="true" role="dialog" aria-label="Mapa zorzy" hidden>
    <div id="auroraMap" aria-label="Mapa aktualnej aktywności zorzy"></div>
    <button type="button" class="map-close map-btn" id="closeMap" aria-label="Zamknij mapę"></button>
    <button type="button" class="map-locate map-btn" id="locateMap" aria-label="Wróć do lokalizacji"></button>
    <div class="map-panel">
      <div class="map-legend"><span>Niska</span><i></i><span>Wysoka</span></div>
      <div class="map-note" id="mapNote">Ładowanie aktualnego modelu NOAA…</div>
    </div>
  </section>

  <div class="sheet-backdrop" id="detailBackdrop" hidden></div>
  <section class="info-sheet sheet" id="infoSheet" aria-modal="true" role="dialog" aria-labelledby="infoTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2 id="infoTitle">Szczegóły</h2><button id="closeInfo" aria-label="Zamknij szczegóły"></button></div>
    <div class="sheet-scroll" id="infoScroll">
      <div class="info-body" id="infoBody"></div>
      <p class="source-note" id="infoSource"></p>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script type="module" src="./js/main.js?v=89"></script>
</body>
</html>

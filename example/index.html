#aurora-merged .day.evening{width:5.71%;border-radius:6px 0 0 6px;}
#aurora-merged .twilight{background:light-dark(#adb8c9,#637084);}

#aurora-merged .night{background:light-dark(#283e56,#101a27);color:#eef4fa;width:60.72%;}

#aurora-merged .day.morning{width:8.33%;border-radius:0 6px 6px 0;}
